<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(45deg, #0f0c29, #302b63, #24243e);
}

.login-card {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 40px;
    width: 400px;
    border-radius: 20px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    color: white;
    text-align: center;
}

h2 { margin-bottom: 10px; font-weight: 600; }
p { font-size: 0.9rem; color: #ccc; margin-bottom: 30px; }

.input-group {
    position: relative;
    margin-bottom: 25px;
}

.input-group input {
    width: 100%;
    padding: 12px 10px;
    background: transparent;
    border: none;
    border-bottom: 2px solid #fff;
    outline: none;
    color: #fff;
    font-size: 1rem;
    transition: 0.3s;
}

.input-group label {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: #ccc;
    pointer-events: none;
    transition: 0.3s;
}

/* Float label on focus or if input has text */
.input-group input:focus ~ label,
.input-group input:valid ~ label {
    top: -5px;
    font-size: 0.8rem;
    color: #00d2ff;
}

.options {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    margin-bottom: 25px;
}

.login-btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 25px;
    background: #00d2ff;
    color: #fff;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.login-btn:hover {
    background: #3a7bd5;
    box-shadow: 0 0 15px #00d2ff;
}

.footer { margin-top: 20px; font-size: 0.85rem; }
.footer a { color: #00d2ff; text-decoration: none; }</style>
</head>
<body>
    <div class="login-card">
        <h2>Welcome Back</h2>
        <p>Enter your credentials to access your account</p>
        
        <form id="loginForm">
            <div class="input-group">
                <input type="email" id="email" required>
                <label>Email Address</label>
            </div>
            <div class="input-group">
                <input type="password" id="password" required>
                <label>Password</label>
            </div>
            <div class="options">
                <label><input type="checkbox"> Remember me</label>
                <a href="#">Forgot Password?</a>
            </div>
            <button type="submit" class="login-btn">Sign In</button>
        </form>

        <div class="footer">
            Don't have an account? <a href="#">Create one</a>
        </div>
    </div>
    <script>document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const btn = document.querySelector('.login-btn');
    const email = document.getElementById('email').value;

    // Visual feedback
    btn.innerText = "Authenticating...";
    btn.style.opacity = "0.7";
    btn.disabled = true;

    // Simulate API call
    setTimeout(() => {
        alert(`Welcome back, ${email.split('@')[0]}!`);
        btn.innerText = "Sign In";
        btn.style.opacity = "1";
        btn.disabled = false;
    }, 1500);
});
</script>
</body>
</html>
